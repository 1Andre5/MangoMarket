<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangoMarket | Carrito</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="carrito">
    <header>
        <nav>
            <a class="logo" href="index.html">MangoMarket</a>

            <ul>
                <li><a href="index.html" data-nav="inicio">Inicio</a></li>
                <li><a href="productos.html" data-nav="productos">Productos</a></li>
                <li><a href="productores.html" data-nav="productores">Productores</a></li>
                <li><a href="contacto.html" data-nav="contacto">Contacto</a></li>
                <li><a href="cuenta.html" data-nav="cuenta">Cuenta</a></li>
            </ul>

            <a class="carrito-icono" href="carrito.html" data-nav="carrito">
                Carrito: <span id="contador-carrito">0</span>
            </a>
        </nav>
    </header>

    <main>
        <section class="page-hero carrito-hero">
            <div>
                <h1>Carrito de Compras</h1>
                <p>Revisa tus mangos seleccionados antes de coordinar el pedido.</p>
            </div>
        </section>

        <section class="carrito carrito-page">
            <div class="carrito-resumen">
                <h2>Tu pedido</h2>
                <div id="lista-carrito"></div>
                <h3>Total: S/ <span id="total">0</span></h3>
                <div class="carrito-acciones">
                    <a class="btn btn-secundario" href="productos.html">Seguir comprando</a>
                    <a class="btn" id="boton-finalizar-compra" href="checkout.html">Finalizar compra</a>
                    <button type="button" onclick="vaciarCarrito()">Vaciar carrito</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MangoMarket - Apoyando agricultores peruanos</p>
    </footer>

    <script src="carrito.js"></script>
    <script src="script.js"></script>
</body>
</html>
